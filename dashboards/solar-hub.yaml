                  - entity: sensor.home_solar_energy_monitor_circuit_hallway_lights_bedroom_3
                    name: "#20 (15A) Hallway Lights & Bed #3"
                    secondary_info: "garage hall light BED #3 HALL LIGHT BED #2 HALL ROOM #3"
                    icon: mdi:lightbulb-group
                  - entity: sensor.home_solar_energy_monitor_circuit_foyer_lights_outlets
                    name: "#22 (15A) Foyer Lights & Outlets"
                    secondary_info: "Foyer Lights Foyer Plugs"

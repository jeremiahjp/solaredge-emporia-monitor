    footer:
      card:
        type: custom:dashboard-footer-card
        background: "rgba(10, 15, 29, 0.96)"
        blur: true
        floating_mobile: true
        floating_desktop: true
        bottom_offset: "12px"
        max_width: "620px"
        icon_size: 24
        font_size: 11
        card_mod:
          style: |
            ha-card.footer-card {
              background: rgba(10, 15, 29, 0.95) !important;
              backdrop-filter: blur(24px) saturate(180%) !important;
              -webkit-backdrop-filter: blur(24px) saturate(180%) !important;
              border: 1px solid rgba(255, 255, 255, 0.18) !important;
              box-shadow: 0 16px 36px rgba(0, 0, 0, 0.85), 0 0 1px rgba(255, 255, 255, 0.2) !important;
              border-radius: 24px !important;
            }
            .route:not(.active) .route-icon-wrap ha-icon {
              color: rgba(226, 232, 240, 0.75) !important;
            }
            .route:not(.active) .route-label {
              color: rgba(203, 213, 225, 0.75) !important;
              font-weight: 500 !important;
            }
            .route.active .route-label {
              color: #ffffff !important;
              font-weight: 700 !important;
            }
        routes:
          - icon: mdi:lightning-bolt-circle
            label: Live Flow
            path: /solar-hub/live
            icon_color: "rgba(226, 232, 240, 0.75)"
            active_color: "#38bdf8"
          - icon: mdi:chart-timeline-variant
            label: Circuits
            path: /solar-hub/circuits
            icon_color: "rgba(226, 232, 240, 0.75)"
            active_color: "#2dd4bf"
            badge_content: "{{ states | selectattr('entity_id', 'match', 'sensor.home_solar_energy_monitor_circuit_') | rejectattr('state', 'in', ['unavailable', 'unknown']) | map(attribute='state') | map('float') | select('gt', 0) | list | count }}"
            badge_color: "#0d9488"
          - icon: mdi:chart-bell-curve-cumulative
            label: Analytics
            path: /solar-hub/analytics
            icon_color: "rgba(226, 232, 240, 0.75)"
            active_color: "#f59e0b"
          - icon: mdi:server-network
            label: System
            path: /solar-hub/system
            icon_color: "rgba(226, 232, 240, 0.75)"
            active_color: "#c084fc"
            badge_content: "{% set errs = states('sensor.home_solar_energy_monitor_daemon_error_count') | int(0) %}{% if errs > 0 %}{{ errs }}{% endif %}"
            badge_color: "#ef4444"

  # ============================================================================
  # VIEW 3: 24-HOUR ANALYTICS & FINANCIAL BALANCE
  # ============================================================================
  - title: Analytics
    path: analytics
    icon: mdi:chart-bell-curve-cumulative
    subview: true
    type: sections
    max_columns: 2
    background: transparent
    sections:
      # ------------------------------------------------------------------------
      # SECTION 1: LIVE POWER ROUTING & SANKEY DISTRIBUTION
      # ------------------------------------------------------------------------
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Live Power Routing & Flow Distribution
            icon: mdi:sitemap
          - type: custom:sankey-chart
            title: Real-Time Wattage Flow
            show_names: true
            round: 0
            unit_prefix: ' '
            height: 230
            nodes:
              - id: sensor.home_solar_energy_monitor_solar_production
                name: Solar Generation
                color: '#ffb300'
                section: 0
              - id: grid_import
                entity_id: sensor.home_solar_energy_monitor_grid_net_power
                name: Grid Import
                color: '#ef4444'
                section: 0
              - id: sensor.home_solar_energy_monitor_house_consumption
                name: House Load
                color: '#00e5ff'
                section: 1
                children_sum:
                  should_be: equal_or_less
                  reconcile_to: max
              - id: grid_export
                entity_id: sensor.home_solar_energy_monitor_grid_net_power
                name: Grid Export
                color: '#10b981'
                filters:
                  - multiply: -1
                section: 1
              - id: sensor.home_solar_energy_monitor_circuit_hvac_nest_thermostat
                name: HVAC / AC (est)
                color: '#06b6d4'
                section: 2
              - id: sensor.home_solar_energy_monitor_circuit_office
                name: Office
                color: '#38bdf8'
                section: 2
              - id: sensor.fridge_circuit_circuit_fridge
                name: Refrigerator
                color: '#34d399'
                section: 2
              - id: sensor.home_solar_energy_monitor_circuit_master_bed
                name: Master Bed
                color: '#fbbf24'
                section: 2
              - id: house_other
                name: Other Circuits
                type: remaining_parent_state
                color: '#94a3b8'
                section: 2
            links:
              - source: sensor.home_solar_energy_monitor_solar_production
                target: sensor.home_solar_energy_monitor_house_consumption
              - source: sensor.home_solar_energy_monitor_solar_production
                target: grid_export
              - source: grid_import
                target: sensor.home_solar_energy_monitor_house_consumption
              - source: sensor.home_solar_energy_monitor_house_consumption
                target: sensor.home_solar_energy_monitor_circuit_hvac_nest_thermostat
              - source: sensor.home_solar_energy_monitor_house_consumption
                target: sensor.home_solar_energy_monitor_circuit_office
              - source: sensor.home_solar_energy_monitor_house_consumption
                target: sensor.fridge_circuit_circuit_fridge
              - source: sensor.home_solar_energy_monitor_house_consumption
                target: sensor.home_solar_energy_monitor_circuit_master_bed
              - source: sensor.home_solar_energy_monitor_house_consumption
                target: house_other
            card_mod:
              style: |
                ha-card {
                  background: rgba(15, 23, 42, 0.75) !important;
                  backdrop-filter: blur(16px) !important;
                  -webkit-backdrop-filter: blur(16px) !important;
                  border: 1px solid rgba(255, 255, 255, 0.10) !important;
                  border-radius: 18px !important;
                  padding: 12px !important;
                }

      # ------------------------------------------------------------------------
      # SECTION 2: 24-HOUR ENERGY PROFILE
      # ------------------------------------------------------------------------
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: 24-Hour Energy Timeline
            icon: mdi:chart-timeline-variant-shimmer
          - type: custom:apexcharts-card
            experimental:
              disable_config_validation: true
            header:
              show: true
              title: 24-Hour Power Profile
              show_states: true
              colorize_states: true
            graph_span: 24h
            span:
              end: minute
            update_interval: 2m
            all_series_config:
              curve: smooth
              group_by:
                func: avg
                duration: 5m
            apex_config:
              chart:
                height: 330px
                zoom:
                  enabled: false
                toolbar:
                  show: false
              grid:
                borderColor: rgba(255, 255, 255, 0.08)
                strokeDashArray: 3
              legend:
                show: true
                position: top
                horizontalAlign: right
                labels:
                  colors: '#cbd5e1'
              tooltip:
                shared: true
                intersect: false
                theme: dark
              stroke:
                curve: smooth
            yaxis:
              - id: power
                min: 0
                decimals: 0
                apex_config:
                  title:
                    text: Solar & House (W)
                    style:
                      color: '#94a3b8'
                      fontSize: '11px'
                      fontWeight: 500
                  labels:
                    style:
                      colors: '#94a3b8'
                      fontSize: '11px'
              - id: grid
                opposite: true
                decimals: 0
                apex_config:
                  title:
                    text: Grid Net (W)
                    style:
                      color: '#d946ef'
                      fontSize: '11px'
                      fontWeight: 500
                  labels:
                    style:
                      colors: '#d946ef'
                      fontSize: '11px'
            series:
              - entity: sensor.home_solar_energy_monitor_solar_production
                name: Solar Generation
                yaxis_id: power
                color: '#ffb300'
                type: area
                opacity: 0.28
                stroke_width: 2.8
                fill_raw: last
              - entity: sensor.home_solar_energy_monitor_house_consumption
                name: House Consumed
                yaxis_id: power
                color: '#00e5ff'
                type: line
                stroke_width: 2.8
                fill_raw: last
              - entity: sensor.home_solar_energy_monitor_grid_net_power
                name: Grid Net (+Import / -Export)
                yaxis_id: grid
                color: '#d946ef'
                type: line
                stroke_width: 1.8
                fill_raw: last
            card_mod:
              style: |
                ha-card {
                  background: rgba(15, 23, 42, 0.75) !important;
                  backdrop-filter: blur(16px) !important;
                  border: 1px solid rgba(255, 255, 255, 0.10) !important;
                  border-radius: 18px !important;
                }

      # ------------------------------------------------------------------------
      # SECTION 3: INVERTER THERMAL DYNAMICS (COLUMN 1)
      # ------------------------------------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: Inverter Thermal Load
            icon: mdi:thermometer-alert
          - type: custom:apexcharts-card
            experimental:
              disable_config_validation: true
            header:
              show: true
              title: Heat Dissipation vs Solar Output (24h)
              show_states: true
              colorize_states: true
            graph_span: 24h
            span:
              end: minute
            apex_config:
              chart:
                height: 280px
                toolbar:
                  show: false
              grid:
                borderColor: rgba(255, 255, 255, 0.06)
              legend:
                show: true
                position: top
                horizontalAlign: right
              stroke:
                curve: smooth
                width: [2.5, 2]
            yaxis:
              - id: power
                min: 0
                decimals: 0
                apex_config:
                  title:
                    text: Solar (W)
                  labels:
                    style:
                      colors: '#f59e0b'
              - id: temp
                opposite: true
                decimals: 0
                apex_config:
                  title:
                    text: Temp (°F)
                  labels:
                    style:
                      colors: '#f43f5e'
            series:
              - entity: sensor.home_solar_energy_monitor_solar_production
                name: Solar AC
                yaxis_id: power
                color: '#f59e0b'
                type: area
                opacity: 0.25
                stroke_width: 2.5
                fill_raw: last
                group_by:
                  func: avg
                  duration: 5m
              - entity: sensor.home_solar_energy_monitor_inverter_temperature
                name: Inverter Temp
                yaxis_id: temp
                color: '#f43f5e'
                type: line
                stroke_width: 2
                fill_raw: last
                group_by:
                  func: avg
                  duration: 5m
            card_mod:
              style: |
                ha-card {
                  background: rgba(15, 23, 42, 0.75) !important;
                  backdrop-filter: blur(16px) !important;
                  border: 1px solid rgba(255, 255, 255, 0.10) !important;
                  border-radius: 18px !important;
                }

      # ------------------------------------------------------------------------
      # SECTION 4: ACTIVE CIRCUITS BREAKDOWN (COLUMN 2)
      # ------------------------------------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: Active Circuits Breakdown
            icon: mdi:chart-donut
          - type: custom:apexcharts-card
            header:
              show: true
              title: Monitored Circuit Share
              show_states: false
            chart_type: donut
            apex_config:
              chart:
                height: 280px
              legend:
                show: true
                position: right
                fontSize: 12px
                labels:
                  colors: '#cbd5e1'
              plotOptions:
                pie:
                  donut:
                    size: '65%'
                    labels:
                      show: true
                      total:
                        show: true
                        label: 'Monitored'
                        fontSize: '11px'
                        color: '#94a3b8'
                        formatter: |
                          EVAL:function (w) {
                            const sum = w.globals.seriesTotals.reduce((a, b) => a + b, 0);
                            return sum.toFixed(0) + ' W';
                          }
            series:
              - entity: sensor.home_solar_energy_monitor_circuit_hvac_nest_thermostat
                name: HVAC / AC (est)
                color: '#06b6d4'
              - entity: sensor.home_solar_energy_monitor_circuit_office
                name: Office
                color: '#38bdf8'
              - entity: sensor.fridge_circuit_circuit_fridge
                name: Fridge
                color: '#2dd4bf'
              - entity: sensor.home_solar_energy_monitor_circuit_master_bed
                name: Master Bed
                color: '#f59e0b'
              - entity: sensor.home_solar_energy_monitor_circuit_dedicated_freezer
                name: Freezer
                color: '#a855f7'
              - entity: sensor.home_solar_energy_monitor_circuit_microwave
                name: Microwave
                color: '#ec4899'
              - entity: sensor.home_solar_energy_monitor_circuit_bed_bathroom_3
                name: Bed / Bath 3
                color: '#6366f1'
            card_mod:
              style: |
                ha-card {
                  background: rgba(15, 23, 42, 0.75) !important;
                  backdrop-filter: blur(16px) !important;
                  border: 1px solid rgba(255, 255, 255, 0.10) !important;
                  border-radius: 18px !important;
                }

      # ------------------------------------------------------------------------
      # SECTION 5: DAILY TOTALS & FINANCIAL BALANCE
      # ------------------------------------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: Daily Totals & Financial Balance
            icon: mdi:cash-multiple
          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                entity: sensor.home_solar_energy_monitor_net_energy_cost_today
                name: Net Energy Cost
                icon: mdi:cash-check
                color: green
                vertical: false
              - type: tile
                entity: sensor.home_solar_energy_monitor_solar_produced_today
                name: Solar Produced
                icon: mdi:solar-power-variant
                color: amber
                vertical: false
              - type: tile
                entity: sensor.home_solar_energy_monitor_house_consumed_today
                name: House Consumed
                icon: mdi:home-lightning-bolt
                color: blue
                vertical: false
              - type: tile
                entity: sensor.home_solar_energy_monitor_grid_export_credit_today
                name: Export Credit
                icon: mdi:bank-transfer-in
                color: teal
                vertical: false
              - type: tile
                entity: sensor.home_solar_energy_monitor_grid_exported_today
                name: Grid Exported
                icon: mdi:transmission-tower-export
                color: teal
                vertical: false
              - type: tile
                entity: sensor.home_solar_energy_monitor_grid_imported_today
                name: Grid Imported
                icon: mdi:transmission-tower-import
                color: red
                vertical: false

      # ------------------------------------------------------------------------
      # SECTION 6: SYSTEM INDEPENDENCE & LIFETIME IMPACT
      # ------------------------------------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: Independence & Lifetime Environmental Impact
            icon: mdi:earth
          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                entity: sensor.home_solar_energy_monitor_self_powered_ratio
                name: Self-Powered Ratio
                icon: mdi:shield-sun
                color: green
                vertical: false
              - type: tile
                entity: sensor.home_solar_energy_monitor_solar_lifetime_production
                name: Lifetime Solar Output
                icon: mdi:counter
                color: deep-purple
                vertical: false
              - type: tile
                entity: sensor.home_solar_energy_monitor_solar_dc_power
                name: Solar DC Array Input
                icon: mdi:solar-panel-large
                color: orange
                vertical: false
          - type: markdown
            card_mod:
              style: |
                ha-card {
                  background: rgba(15, 23, 42, 0.75) !important;
                  backdrop-filter: blur(16px) !important;
                  border: 1px solid rgba(255, 255, 255, 0.10) !important;
                  border-radius: 18px !important;
                  padding: 14px 18px !important;
                }
            content: >-
              {% set lifetime = states('sensor.home_solar_energy_monitor_solar_lifetime_production') | float(0) %}
              {% set co2_tons = (lifetime * 0.000707) | round(1) %}
              {% set trees = (lifetime * 0.0117) | round(0) | int %}
              {% set est_savings = (lifetime * 0.14) | round(0) | int %}

              | Metric | Impact | Description |
              | :--- | :--- | :--- |
              | 🌱 **CO₂ Avoided** | **{{ co2_tons }} metric tons** | Greenhouse gas emissions offset |
              | 🌲 **Trees Equivalent** | **{{ trees }} seedlings** | Carbon sequestered over 10 years |
              | ⚡ **Total Clean Energy** | **{{ (lifetime / 1000) | round(1) }} MWh** | Cumulative solar generation |
              | 💵 **Estimated Solar Savings** | **~${{ est_savings }} USD** | Cumulative utility bill offset |
    footer:
      card:
        type: custom:dashboard-footer-card
        background: "rgba(10, 15, 29, 0.96)"
        blur: true
        floating_mobile: true
        floating_desktop: true
        bottom_offset: "12px"
        max_width: "620px"
        icon_size: 24
        font_size: 11
        card_mod:
          style: |
            ha-card.footer-card {
              background: rgba(10, 15, 29, 0.95) !important;
              backdrop-filter: blur(24px) saturate(180%) !important;
              -webkit-backdrop-filter: blur(24px) saturate(180%) !important;
              border: 1px solid rgba(255, 255, 255, 0.18) !important;
              box-shadow: 0 16px 36px rgba(0, 0, 0, 0.85), 0 0 1px rgba(255, 255, 255, 0.2) !important;
              border-radius: 24px !important;
            }
            .route:not(.active) .route-icon-wrap ha-icon {
              color: rgba(226, 232, 240, 0.75) !important;
            }
            .route:not(.active) .route-label {
              color: rgba(203, 213, 225, 0.75) !important;
              font-weight: 500 !important;
            }
            .route.active .route-label {
              color: #ffffff !important;
              font-weight: 700 !important;
            }
        routes:
          - icon: mdi:lightning-bolt-circle
            label: Live Flow
            path: /solar-hub/live
            icon_color: "rgba(226, 232, 240, 0.75)"
            active_color: "#38bdf8"
          - icon: mdi:chart-timeline-variant
            label: Circuits
            path: /solar-hub/circuits
            icon_color: "rgba(226, 232, 240, 0.75)"
            active_color: "#2dd4bf"
            badge_content: "{{ states | selectattr('entity_id', 'match', 'sensor.home_solar_energy_monitor_circuit_') | rejectattr('state', 'in', ['unavailable', 'unknown']) | map(attribute='state') | map('float') | select('gt', 0) | list | count }}"
            badge_color: "#0d9488"
          - icon: mdi:chart-bell-curve-cumulative
            label: Analytics
            path: /solar-hub/analytics
            icon_color: "rgba(226, 232, 240, 0.75)"
            active_color: "#f59e0b"
          - icon: mdi:server-network
            label: System
            path: /solar-hub/system
            icon_color: "rgba(226, 232, 240, 0.75)"
            active_color: "#c084fc"
            badge_content: "{% set errs = states('sensor.home_solar_energy_monitor_daemon_error_count') | int(0) %}{% if errs > 0 %}{{ errs }}{% endif %}"
            badge_color: "#ef4444"

  # ============================================================================
  # VIEW 4: SYSTEM TELEMETRY & DIAGNOSTICS
  # ============================================================================
  - title: System
    path: system
    icon: mdi:server-network
    subview: true
    type: sections
    max_columns: 2
    background: transparent
    sections:
      # ------------------------------------------------------------------------
      # SECTION 1: SOLAR PIPELINE & DAEMON HEALTH
      # ------------------------------------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: Solar Pipeline & Daemon Health
            icon: mdi:server
          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                entity: binary_sensor.home_solar_energy_monitor_solar_daemon_service
                name: Solar Daemon Service
                icon: mdi:server
                color: teal
                vertical: false
              - type: tile
                entity: sensor.home_solar_energy_monitor_daemon_uptime
                name: Pipeline Uptime
                icon: mdi:clock-check-outline
                color: cyan
                vertical: false
              - type: tile
                entity: sensor.home_solar_energy_monitor_daemon_memory_usage
                name: Daemon Memory
                icon: mdi:memory
                color: light-blue
                vertical: false
              - type: tile
                entity: sensor.home_solar_energy_monitor_daemon_error_count
                name: Pipeline Error Count
                icon: mdi:shield-alert-outline
                color: red
                vertical: false

      # ------------------------------------------------------------------------
      # SECTION 2: HYPER-V VM HOST & SYSTEM RESOURCE DIAGNOSTICS
      # ------------------------------------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: Hyper-V VM Host & Resource Diagnostics
            icon: mdi:monitor-dashboard
          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                entity: sensor.system_monitor_load_1_min
                name: CPU Load Average (1m)
                icon: mdi:cpu-64-bit
                color: cyan
                vertical: false
              - type: tile
                entity: sensor.system_monitor_memory_usage
                name: Host RAM Usage
                icon: mdi:memory
                color: purple
                vertical: false
              - type: tile
                entity: sensor.system_monitor_disk_usage
                name: Virtual Disk Used (.vhdx)
                icon: mdi:harddisk
                color: amber
                vertical: false
              - type: tile
                entity: sensor.system_monitor_io_pressure_some_10s_average
                name: Disk I/O Pressure (Watchdog)
                icon: mdi:speedometer
                color: green
                vertical: false
          - type: markdown
            card_mod:
              style: |
                ha-card {
                  background: rgba(15, 23, 42, 0.75) !important;
                  backdrop-filter: blur(16px) !important;
                  border: 1px solid rgba(255, 255, 255, 0.08) !important;
                  border-radius: 16px !important;
                  padding: 12px 18px !important;
                }
            content: >-
              {% set ram_used = states('sensor.system_monitor_memory_use') %}
              {% set ram_pct = states('sensor.system_monitor_memory_usage') %}
              {% set disk_free = states('sensor.system_monitor_disk_free') %}
              {% set disk_pct = states('sensor.system_monitor_disk_usage') %}
              {% set io_press = states('sensor.system_monitor_io_pressure_some_10s_average') %}
              {% set load = states('sensor.system_monitor_load_1_min') %}
              {% set pill = 'display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:12px;font-size:11px;font-weight:600;' %}
              {% set pill_dark = 'background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.85);border:1px solid rgba(255,255,255,0.1);' %}
              {% set pill_green = 'background:rgba(34,197,94,0.12);color:#4ade80;border:1px solid rgba(34,197,94,0.25);' %}

              | Diagnostic Metric | Live Value | Status |
              | :--- | :--- | :--- |
              | 🚀 **Virtualization Engine** | **Microsoft Hyper-V (Gen 2 UEFI)** | <span style="{{ pill }}{{ pill_green }}">Native VT-x/AMD-V</span> |
              | 🧠 **Memory Allocation** | **{{ ram_used }} ({{ ram_pct }}%)** | <span style="{{ pill }}{{ pill_green }}">Plentiful Overhead</span> |
              | 💽 **Storage Space Free** | **{{ disk_free }} ({{ disk_pct }}% used)** | <span style="{{ pill }}{{ pill_dark }}">Dynamic VHDX</span> |
              | ⏱️ **Watchdog I/O Latency** | **{{ io_press }}%** | <span style="{{ pill }}{{ pill_green }}">Zero Disk Stalls</span> |

      # ------------------------------------------------------------------------
      # SECTION 3: SOLAREDGE INVERTER HARDWARE TELEMETRY
      # ------------------------------------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: SolarEdge Inverter Hardware Diagnostics
            icon: mdi:solar-power-variant
          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                entity: sensor.home_solar_energy_monitor_inverter_temperature
                name: Inverter Heatsink Temp
                icon: mdi:thermometer-high
                color: orange
                vertical: false
              - type: tile
                entity: sensor.home_solar_energy_monitor_solar_dc_power
                name: Solar DC Array Input
                icon: mdi:solar-panel-large
                color: amber
                vertical: false

      # ------------------------------------------------------------------------
      # SECTION 4: ERROR LOGS & DIAGNOSTICS
      # ------------------------------------------------------------------------
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Subsystem Error Logs & History
            icon: mdi:clipboard-text-clock
          - type: markdown
            card_mod:
              style: |
                ha-card {
                  background: rgba(15, 23, 42, 0.85) !important;
                  border: 1px solid rgba(255, 255, 255, 0.08) !important;
                  border-radius: 16px !important;
                  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25) !important;
                }
            content: >-
              {% set err_count = states('sensor.home_solar_energy_monitor_daemon_error_count') | int(0) %}
              {% set log_entries = state_attr('sensor.home_solar_energy_monitor_daemon_error_log', 'errors') %}
              {% if err_count == 0 or not log_entries %}
                <div style="display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 10px; background: rgba(34, 197, 94, 0.08); border: 1px solid rgba(34, 197, 94, 0.25);">
                  <ha-icon icon="mdi:check-decagram" style="color: #22c55e; --mdc-icon-size: 28px;"></ha-icon>
                  <div>
                    <div style="font-weight: 700; color: #22c55e; font-size: 14px;">All Pipeline Systems Healthy</div>
                    <div style="font-size: 12px; color: rgba(255,255,255,0.6); margin-top: 2px;">SolarEdge Modbus TCP & Emporia Vue polling normally. 0 errors logged.</div>
                  </div>
                </div>
              {% else %}
                <div style="display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; margin-bottom: 12px; border-radius: 10px; background: rgba(239, 68, 68, 0.12); border: 1px solid rgba(239, 68, 68, 0.3);">
                  <div style="display: flex; align-items: center; gap: 8px;">
                    <ha-icon icon="mdi:alert-circle" style="color: #ef4444; --mdc-icon-size: 24px;"></ha-icon>
                    <span style="font-weight: 700; color: #f87171; font-size: 14px;">{{ err_count }} Recent Error(s) Encountered</span>
                  </div>
                  <span style="font-size: 11px; color: rgba(255,255,255,0.5);">Latest: {{ state_attr('sensor.home_solar_energy_monitor_daemon_error_log', 'last_check') }}</span>
                </div>

                | Time | Subsystem | Error Details |
                | :--- | :--- | :--- |
                {% for err in log_entries %}
                | `{{ err.time }}` | **{{ err.source }}** | {{ err.message }} |
                {% endfor %}
              {% endif %}
    footer:
      card:
        type: custom:dashboard-footer-card
        background: "rgba(10, 15, 29, 0.96)"
        blur: true
        floating_mobile: true
        floating_desktop: true
        bottom_offset: "12px"
        max_width: "620px"
        icon_size: 24
        font_size: 11
        card_mod:
          style: |
            ha-card.footer-card {
              background: rgba(10, 15, 29, 0.95) !important;
              backdrop-filter: blur(24px) saturate(180%) !important;
              -webkit-backdrop-filter: blur(24px) saturate(180%) !important;
              border: 1px solid rgba(255, 255, 255, 0.18) !important;
              box-shadow: 0 16px 36px rgba(0, 0, 0, 0.85), 0 0 1px rgba(255, 255, 255, 0.2) !important;
              border-radius: 24px !important;
            }
            .route:not(.active) .route-icon-wrap ha-icon {
              color: rgba(226, 232, 240, 0.75) !important;
            }
            .route:not(.active) .route-label {
              color: rgba(203, 213, 225, 0.75) !important;
              font-weight: 500 !important;
            }
            .route.active .route-label {
              color: #ffffff !important;
              font-weight: 700 !important;
            }
        routes:
          - icon: mdi:lightning-bolt-circle
            label: Live Flow
            path: /solar-hub/live
            icon_color: "rgba(226, 232, 240, 0.75)"
            active_color: "#38bdf8"
          - icon: mdi:chart-timeline-variant
            label: Circuits
            path: /solar-hub/circuits
            icon_color: "rgba(226, 232, 240, 0.75)"
            active_color: "#2dd4bf"
            badge_content: "{{ states | selectattr('entity_id', 'match', 'sensor.home_solar_energy_monitor_circuit_') | rejectattr('state', 'in', ['unavailable', 'unknown']) | map(attribute='state') | map('float') | select('gt', 0) | list | count }}"
            badge_color: "#0d9488"
          - icon: mdi:chart-bell-curve-cumulative
            label: Analytics
            path: /solar-hub/analytics
            icon_color: "rgba(226, 232, 240, 0.75)"
            active_color: "#f59e0b"
          - icon: mdi:server-network
            label: System
            path: /solar-hub/system
            icon_color: "rgba(226, 232, 240, 0.75)"
            active_color: "#c084fc"
            badge_content: "{% set errs = states('sensor.home_solar_energy_monitor_daemon_error_count') | int(0) %}{% if errs > 0 %}{{ errs }}{% endif %}"
            badge_color: "#ef4444"
